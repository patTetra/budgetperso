<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/wallet.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mes Comptes Perso</title>

  <style>
    /* Variables de base (Light Mode) */
    :root {
      --bg: #f2f2f7;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-solid: #ffffff;
      --text: #000000;
      --text-muted: #8e8e93;
      --border: rgba(60, 60, 67, 0.12);
      --primary: #007aff;
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --radius: 16px;
      --blur: blur(20px);
    }

    /* Support automatique du Mode Sombre iOS */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: rgba(28, 28, 30, 0.82);
        --surface-solid: #1c1c1e;
        --text: #ffffff;
        --text-muted: #8e8e93;
        --border: rgba(84, 84, 88, 0.35);
        --primary: #0a84ff;
        --green: #30d158;
        --red: #ff453a;
        --orange: #ff9f0a;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom)) 16px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* En-tête avec effet Flou translucide (Glassmorphism) */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      background: var(--surface);
      margin: -16px -16px 16px -16px;
      padding: calc(env(safe-area-inset-top) + 12px) 16px 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--border);
    }
    .header h1 { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-icon { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 6px; transition: transform 0.2s ease; }
    .btn-icon:active { transform: scale(0.9); }

    /* Indicateur de synchro GitHub */
    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      transition: all 0.3s ease;
    }
    .sync-success { background-color: var(--green); box-shadow: 0 0 8px var(--green); }
    .sync-pending { background-color: var(--orange); animation: pulse 1s infinite alternate; }
    .sync-error   { background-color: var(--red); box-shadow: 0 0 8px var(--red); }
    @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

    /* Sélecteur de vues style iOS */
    .account-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      background: rgba(118, 118, 128, 0.12);
      padding: 3px;
      border-radius: 10px;
    }
    .account-tab {
      flex: 1;
      text-align: center;
      padding: 7px 2px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .account-tab.active {
      background: var(--surface-solid);
      color: var(--text);
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    }

    /* Dashboard */
    .dashboard-card {
      background: linear-gradient(135deg, #1c1c1e, #2c2c2e);
      color: white;
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      margin-bottom: 16px;
      transition: all 0.4s ease;
    }
    .dashboard-card.status-green { background: linear-gradient(135deg, #248a3d, #155d27) !important; }
    .dashboard-card.status-orange { background: linear-gradient(135deg, #c27803, #855100) !important; }
    .dashboard-card.status-red { background: linear-gradient(135deg, #d32f2f, #7b1fa2) !important; }

    .solde-label { font-size: 0.75rem; color: rgba(255, 255, 255, 0.75); text-transform: uppercase; letter-spacing: 0.5px; }
    .solde-main { font-size: 2.1rem; font-weight: 800; margin: 4px 0 12px 0; }
    .solde-prev-container {
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Stats Card */
    .stats-card {
      background: var(--surface-solid);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
      transition: background-color 0.3s;
    }
    .stats-grid { display: flex; justify-content: space-between; }
    .stat-item { text-align: center; flex: 1; }
    .stat-val { font-weight: 700; font-size: 1.05rem; margin-top: 2px; }
    .stat-val.red { color: var(--red); }
    .stat-val.green { color: var(--green); }

    /* Filtres et Recherche */
    .filter-section { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
    .search-bar {
      width: 100%; padding: 10px 14px; border-radius: 12px;
      border: 0.5px solid var(--border); background: var(--surface-solid); font-size: 0.9rem;
      color: var(--text); outline: none; transition: all 0.2s;
    }
    .search-bar:focus { border-color: var(--primary); }

    .filter-pills { display: flex; gap: 8px; }
    .pill {
      flex: 1; padding: 7px; border: none; border-radius: 10px;
      background: rgba(118, 118, 128, 0.12); color: var(--text-muted);
      font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .pill.active { background: var(--primary); color: white; }

    /* Liste des Opérations & Animations */
    .month-group { margin-bottom: 20px; animation: fadeIn 0.3s ease-in-out; }
    .month-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; margin-left: 4px; }
    .ops-list { background: var(--surface-solid); border-radius: var(--radius); border: 0.5px solid var(--border); overflow: hidden; }
    
    .operation-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px;
      border-bottom: 0.5px solid var(--border); cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .operation-item:active { background-color: rgba(118, 118, 128, 0.1); transform: scale(0.99); }
    .operation-item:last-child { border-bottom: none; }
    .operation-item.is-prevision { opacity: 0.65; }

    .op-left { display: flex; align-items: center; gap: 12px; }
    .op-cat-icon { font-size: 1.2rem; background: var(--bg); padding: 8px; border-radius: 12px; }
    .op-info { display: flex; flex-direction: column; gap: 2px; }
    .op-desc { font-weight: 600; font-size: 0.9rem; }
    .op-credit-end { font-size: 0.75rem; color: var(--orange); font-weight: 600; }

    .btn-action-charge {
      font-size: 0.75rem; background: rgba(52, 199, 89, 0.15); color: var(--green);
      border: 0.5px solid var(--green); padding: 4px 8px; border-radius: 6px; font-weight: 600;
      cursor: pointer; margin-top: 4px; width: fit-content; transition: transform 0.1s;
    }
    .btn-action-charge:active { transform: scale(0.95); }
    .btn-action-charge.salary { background: rgba(0, 122, 255, 0.15); color: var(--primary); border-color: var(--primary); }
    .btn-action-charge.prev { background: rgba(255, 149, 0, 0.15); color: var(--orange); border-color: var(--orange); }

    .op-amount-block { text-align: right; }
    .op-amount { font-weight: 700; font-size: 0.95rem; }
    .op-amount.debit { color: var(--red); }
    .op-amount.credit { color: var(--green); }
    .op-date { font-size: 0.75rem; color: var(--text-muted); }

    /* Bouton d'action flottant (FAB) */
    .fab {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      right: calc(50% - 220px); width: 56px; height: 56px;
      border-radius: 50%; background: var(--primary); color: white; border: none;
      font-size: 1.8rem; box-shadow: 0 6px 20px rgba(0, 122, 255, 0.4); cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 90;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fab:active { transform: scale(0.9); }
    @media (max-width: 480px) { .fab { right: 24px; } }

    /* Modals avec effet Flou translucide */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      display: none; align-items: flex-end; justify-content: center; z-index: 100;
      animation: fadeIn 0.25s ease-out;
    }
    .modal-overlay.open { display: flex; }
    
    .modal-content {
      background: var(--surface-solid); width: 100%; max-width: 480px;
      border-radius: 24px 24px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h2 { margin: 0; font-size: 1.1rem; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; border-radius: 12px; border: 0.5px solid var(--border); font-size: 0.95rem; background: var(--bg); color: var(--text); outline: none; }

    .type-selector { display: flex; gap: 8px; }
    .type-btn { flex: 1; padding: 10px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text); border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .type-btn.active.debit { background: rgba(255, 59, 48, 0.15); color: var(--red); border-color: var(--red); }
    .type-btn.active.credit { background: rgba(52, 199, 89, 0.15); color: var(--green); border-color: var(--green); }

    .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
    .btn-submit { flex: 2; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .btn-secondary { padding: 12px; background: var(--bg); color: var(--text); border: 0.5px solid var(--border); border-radius: 12px; font-weight: 600; cursor: pointer; }
    .btn-delete { flex: 1; padding: 12px; background: rgba(255, 59, 48, 0.15); color: var(--red); border: 0.5px solid var(--red); border-radius: 12px; font-weight: 700; cursor: pointer; display: none; }

    /* Écran de verrouillage PIN */
    #lockScreen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 200;
    }
    .pin-dots { display: flex; gap: 12px; margin: 20px 0 30px 0; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text-muted); transition: all 0.2s; }
    .dot.filled { background: var(--primary); border-color: var(--primary); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 240px; }
    .key-btn {
      width: 64px; height: 64px; border-radius: 50%; background: var(--surface-solid); color: var(--text);
      border: 0.5px solid var(--border); font-size: 1.5rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
    }
    .key-btn:active { transform: scale(0.9); background: var(--border); }
    .face-id-btn { margin-top: 24px; padding: 10px 20px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface-solid); color: var(--primary); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }

    /* Animations Keyframes */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- ÉCRAN DE VERROUILLAGE -->
  <div id="lockScreen" style="display: none;">
    <h2>🔒 Mes Comptes</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Saisissez votre code PIN</p>
    <div class="pin-dots">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
      <div class="dot" id="dot4"></div>
    </div>
    <div class="keypad">
      <button class="key-btn" onclick="pressPin('1')">1</button>
      <button class="key-btn" onclick="pressPin('2')">2</button>
      <button class="key-btn" onclick="pressPin('3')">3</button>
      <button class="key-btn" onclick="pressPin('4')">4</button>
      <button class="key-btn" onclick="pressPin('5')">5</button>
      <button class="key-btn" onclick="pressPin('6')">6</button>
      <button class="key-btn" onclick="pressPin('7')">7</button>
      <button class="key-btn" onclick="pressPin('8')">8</button>
      <button class="key-btn" onclick="pressPin('9')">9</button>
      <div></div>
      <button class="key-btn" onclick="pressPin('0')">0</button>
      <button class="key-btn" onclick="clearPin()">⌫</button>
    </div>
    <button class="face-id-btn" id="faceIdBtn" onclick="authentifierFaceID()" style="display: none;">
      👤 Déverrouiller avec Face ID
    </button>
  </div>

  <div class="header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <h1>Mes Comptes</h1>
      <span id="sync-status" class="sync-dot sync-success" title="Statut de la synchronisation"></span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" title="Rafraîchir" onclick="chargerDonnees()">🔄</button>
      <button class="btn-icon" title="Réglages" onclick="ouvrirConfig()">⚙️</button>
    </div>
  </div>

  <!-- Sélecteur de vue -->
  <div class="account-selector">
    <div class="account-tab active" id="tab-courant" onclick="selectAccountView('courant')">💳 Courant</div>
    <div class="account-tab" id="tab-livret" onclick="selectAccountView('livret')">🐷 Livret</div>
    <div class="account-tab" id="tab-fixes" onclick="selectAccountView('fixes')">📅 Charges Fixes</div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard-card" id="dashboardCard">
    <div class="solde-label" id="soldeLabel">Solde Compte Courant</div>
    <div id="soldeActuel" class="solde-main">0,00 €</div>
    <div class="solde-prev-container">
      <span>Solde Prévisionnel (Reste du cycle)</span>
      <strong id="soldePrevisionnel">0,00 €</strong>
    </div>
  </div>

  <!-- RÉSUMÉ -->
  <div class="stats-card" id="statsCard">
    <div class="stats-grid">
      <div class="stat-item">
        <div style="font-size:0.75rem; color:var(--text-muted);">ENTRÉES MOIS</div>
        <div id="statCredit" class="stat-val green">+0,00 €</div>
      </div>
      <div class="stat-item">
        <div style="font-size:0.75rem; color:var(--text-muted);">SORTIES MOIS</div>
        <div id="statDebit" class="stat-val red">-0,00 €</div>
      </div>
    </div>
  </div>

  <!-- RECHERCHE & FILTRES RAPIDES -->
  <div class="filter-section" id="filterSection">
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Rechercher..." oninput="afficherDonnees()">
    <div class="filter-pills">
      <button class="pill active" onclick="setFilter('all', this)">Toutes</button>
      <button class="pill" onclick="setFilter('credit', this)">Entrées</button>
      <button class="pill" onclick="setFilter('debit', this)">Sorties</button>
    </div>
  </div>

  <div id="historiqueContainer">Chargement...</div>

  <button class="fab" id="fabAdd" onclick="ouvrirModalAjout()">+</button>

  <!-- MODAL OPÉRATION -->
  <div id="opModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nouvelle opération</h2>
        <button class="btn-icon" onclick="fermerModalOp()">✕</button>
      </div>
      <form onsubmit="sauvegarderOperation(event)">
        <input type="hidden" id="editOpId">

        <div class="form-group type-selector">
          <button type="button" id="btnTypeDebit" class="type-btn active debit" onclick="setType('debit')">Débit</button>
          <button type="button" id="btnTypeCredit" class="type-btn credit" onclick="setType('credit')">Crédit</button>
        </div>

        <div class="form-group" id="groupCompte">
          <label>Compte concerné</label>
          <select id="compteOp" class="form-control">
            <option value="courant">💳 Compte Courant</option>
            <option value="livret">🐷 Livret D'Épargne</option>
          </select>
        </div>

        <div class="form-group">
          <label>Montant (€)</label>
          <input type="number" step="0.01" inputmode="decimal" id="montantOp" class="form-control" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" id="descOp" class="form-control" placeholder="ex: Courses, Prêt maison..." required>
        </div>

        <div class="form-group">
          <label>Catégorie</label>
          <select id="catOp" class="form-control" onchange="toggleDateFinCredit()">
            <option value="🏠 Logement">🏠 Logement / Crédit</option>
            <option value="💼 Salaire">💼 Salaire / Revenu</option>
            <option value="🚗 Transport">🚗 Transport / Auto</option>
            <option value="📄 Assurance">📄 Assurance / Facture</option>
            <option value="🛒 Alimentation">🛒 Courses</option>
            <option value="🎉 Loisirs">🎉 Loisirs</option>
            <option value="🏦 Épargne">🏦 Épargne</option>
            <option value="📦 Autre" selected>📦 Autre</option>
          </select>
        </div>

        <div class="form-group" id="groupDateFinCredit" style="display: none;">
          <label>Date de fin du crédit (Mois / Année)</label>
          <input type="month" id="dateFinCredit" class="form-control">
        </div>

        <div class="form-group" id="groupDate">
          <label>Date</label>
          <input type="date" id="dateOp" class="form-control">
        </div>

        <div class="form-group" id="groupOptions" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size:0.85rem;">
            <input type="checkbox" id="isPrevision"> Opération prévisionnelle (non comptabilisée en solde réel)
          </label>
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size:0.85rem;">
            <input type="checkbox" id="isChargeFixe"> Définir comme Charge Fixe Récurrente (Onglet Charges)
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="btnDelete" class="btn-delete" onclick="supprimerOperation()">Supprimer</button>
          <button type="submit" id="btnSubmit" class="btn-submit">Valider</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONFIGURATION -->
  <div id="configModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Configuration & Options</h2>
        <button class="btn-icon" onclick="fermerConfig()">✕</button>
      </div>

      <div class="form-group"><label>Pseudo GitHub</label><input type="text" id="ghUser" class="form-control"></div>
      <div class="form-group"><label>Nom du Dépôt</label><input type="text" id="ghRepo" class="form-control"></div>
      <div class="form-group"><label>Personal Access Token</label><input type="password" id="ghToken" class="form-control"></div>
      
      <div class="form-group">
        <label>Seuil d'alerte Solde Vert (€)</label>
        <input type="number" id="seuilAlerte" class="form-control" placeholder="ex: 200">
      </div>

      <div class="form-group">
        <label>Code PIN (4 chiffres)</label>
        <input type="password" id="appPin" maxlength="4" placeholder="laisser vide pour désactiver" class="form-control" autocomplete="current-password">
      </div>

      <button class="btn-submit" style="width:100%; margin-bottom: 10px;" onclick="sauvegarderConfig()">Enregistrer</button>
      
      <hr style="border:0; border-top: 0.5px solid var(--border); margin: 16px 0;">

      <div class="form-group" style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn-secondary" style="width:100%" onclick="exporterJSON()">📦 Sauvegarde Intégrale (JSON)</button>
        <button class="btn-secondary" style="width:100%" onclick="exporterCSV()">📥 Exporter toutes les données (CSV)</button>
      </div>
    </div>
  </div>

  <script>
    let rawData = { operations: [], chargesFixes: [] };
    let currentType = "debit";
    let activeAccountView = "courant";
    let currentFilter = "all";
    let enteredPin = "";

    async function initSecurity() {
      const savedPin = localStorage.getItem('app_pin');
      if (savedPin && savedPin.length === 4) {
        document.getElementById('lockScreen').style.display = 'flex';
        // Affiche le bouton uniquement si la biométrie est supportée par l'appareil
        if (window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) {
          document.getElementById('faceIdBtn').style.display = 'flex';
        }
      } else {
        chargerDonnees();
      }
    }

    async function authentifierFaceID() {
      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
          publicKey: { challenge: challenge, timeout: 60000, userVerification: "preferred" }
        });
        if (assertion) {
          document.getElementById('lockScreen').style.display = 'none';
          chargerDonnees();
        }
      } catch (e) {
        alert("Face ID n'est pas encore enregistré sur ce domaine. Veuillez saisir votre code PIN.");
      }
    }

    function pressPin(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDots();
        if (enteredPin.length === 4) {
          if (enteredPin === localStorage.getItem('app_pin')) {
            document.getElementById('lockScreen').style.display = 'none';
            chargerDonnees();
          } else { alert("Code PIN incorrect"); clearPin(); }
        }
      }
    }
    function clearPin() { enteredPin = ""; updatePinDots(); }
    function updatePinDots() {
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`dot${i}`).className = `dot ${i <= enteredPin.length ? 'filled' : ''}`;
      }
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      afficherDonnees();
    }

    function updateSyncStatus(status) {
      const dot = document.getElementById('sync-status');
      if (dot) dot.className = `sync-dot sync-${status}`;
    }

    function selectAccountView(view) {
      activeAccountView = view;
      document.querySelectorAll('.account-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${view}`).classList.add('active');

      const isFixes = view === 'fixes';
      document.getElementById('statsCard').style.display = isFixes ? 'none' : 'block';
      document.getElementById('dashboardCard').style.display = isFixes ? 'none' : 'block';

      const labels = { 'courant': 'Solde Compte Courant', 'livret': 'Solde Livret d\'Épargne' };
      if (!isFixes) document.getElementById('soldeLabel').innerText = labels[view];

      afficherDonnees();
    }

    function setType(type) {
      currentType = type;
      document.getElementById('btnTypeDebit').className = `type-btn debit ${type === 'debit' ? 'active' : ''}`;
      document.getElementById('btnTypeCredit').className = `type-btn credit ${type === 'credit' ? 'active' : ''}`;
    }

    function toggleDateFinCredit() {
      const cat = document.getElementById('catOp').value;
      document.getElementById('groupDateFinCredit').style.display = cat.includes("Logement") ? 'block' : 'none';
    }

    function formatMonthYear(ym) {
      if (!ym) return '';
      const [year, month] = ym.split('-');
      return `${month}/${year}`;
    }

    function ouvrirModalAjout() {
      document.getElementById('modalTitle').innerText = activeAccountView === 'fixes' ? "Nouvelle charge fixe" : "Nouvelle opération";
      document.getElementById('editOpId').value = "";
      document.getElementById('descOp').value = "";
      document.getElementById('montantOp').value = "";
      document.getElementById('dateOp').valueAsDate = new Date();
      document.getElementById('dateFinCredit').value = "";
      document.getElementById('compteOp').value = activeAccountView === 'livret' ? 'livret' : 'courant';
      document.getElementById('isPrevision').checked = false;
      document.getElementById('isChargeFixe').checked = activeAccountView === 'fixes';
      
      const isFixes = activeAccountView === 'fixes';
      document.getElementById('groupDate').style.display = isFixes ? 'none' : 'block';
      document.getElementById('groupCompte').style.display = isFixes ? 'none' : 'block';
      document.getElementById('groupOptions').style.display = isFixes ? 'none' : 'flex';

      document.getElementById('catOp').value = "📦 Autre";
      toggleDateFinCredit();
      document.getElementById('btnDelete').style.display = 'none';
      setType('debit');
      
      document.getElementById('opModal').classList.add('open');
      setTimeout(() => document.getElementById('montantOp').focus(), 100);
    }

    function ouvrirModalEdition(id) {
      const op = rawData.operations.find(o => o.id === id);
      if (!op) return;

      document.getElementById('modalTitle').innerText = "Modifier l'opération";
      document.getElementById('editOpId').value = op.id;
      document.getElementById('descOp').value = op.description;
      document.getElementById('montantOp').value = Math.abs(op.montant);
      document.getElementById('dateOp').value = op.date;
      document.getElementById('compteOp').value = op.compte || 'courant';
      document.getElementById('catOp').value = op.categorie || "📦 Autre";
      document.getElementById('dateFinCredit').value = op.dateFinCredit || "";
      document.getElementById('isPrevision').checked = !!op.isPrevision;
      document.getElementById('isChargeFixe').checked = false;
      
      document.getElementById('groupDate').style.display = 'block';
      document.getElementById('groupCompte').style.display = 'block';
      document.getElementById('groupOptions').style.display = 'flex';
      toggleDateFinCredit();
      
      document.getElementById('btnDelete').style.display = 'block';
      setType(op.type);

      document.getElementById('opModal').classList.add('open');
    }

    function ouvrirModalEditionCharge(id) {
      const cf = rawData.chargesFixes.find(c => c.id === id);
      if (!cf) return;

      document.getElementById('modalTitle').innerText = "Modifier la charge fixe";
      document.getElementById('editOpId').value = cf.id;
      document.getElementById('descOp').value = cf.description;
      document.getElementById('montantOp').value = Math.abs(cf.montant);
      document.getElementById('catOp').value = cf.categorie || "📦 Autre";
      document.getElementById('dateFinCredit').value = cf.dateFinCredit || "";
      document.getElementById('isChargeFixe').checked = true;

      document.getElementById('groupDate').style.display = 'none';
      document.getElementById('groupCompte').style.display = 'none';
      document.getElementById('groupOptions').style.display = 'none';
      toggleDateFinCredit();

      document.getElementById('btnDelete').style.display = 'block';
      setType(cf.type);

      document.getElementById('opModal').classList.add('open');
    }

    function fermerModalOp() { document.getElementById('opModal').classList.remove('open'); }
    
    function ouvrirConfig() {
      const { user, repo, token } = getConfig();
      document.getElementById('ghUser').value = user || '';
      document.getElementById('ghRepo').value = repo || '';
      document.getElementById('ghToken').value = token || '';
      document.getElementById('seuilAlerte').value = localStorage.getItem('seuil_alerte') || '200';
      document.getElementById('appPin').value = localStorage.getItem('app_pin') || '';
      document.getElementById('configModal').classList.add('open');
    }
    function fermerConfig() { document.getElementById('configModal').classList.remove('open'); }

    function getConfig() {
      return {
        user: localStorage.getItem('gh_user'),
        repo: localStorage.getItem('gh_repo'),
        token: localStorage.getItem('gh_token')
      };
    }

    function sauvegarderConfig() {
      localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      localStorage.setItem('seuil_alerte', document.getElementById('seuilAlerte').value.trim() || '200');
      localStorage.setItem('app_pin', document.getElementById('appPin').value.trim());
      fermerConfig();
      chargerDonnees();
    }

    async function chargerDonnees() {
      const { user, repo, token } = getConfig();
      if (!user || !repo || !token) { ouvrirConfig(); return; }

      updateSyncStatus('pending');
      const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json?timestamp=${Date.now()}`;
      try {
        const res = await fetch(url, { headers: { Authorization: `token ${token}` } });
        if (!res.ok) throw new Error();
        const file = await res.json();
        const content = decodeURIComponent(escape(atob(file.content)));
        rawData = JSON.parse(content);
        if (!rawData.chargesFixes) rawData.chargesFixes = [];
        updateSyncStatus('success');
        afficherDonnees();
      } catch (e) {
        updateSyncStatus('error');
        alert("Erreur de synchronisation avec GitHub.");
      }
    }

    function afficherDonnees() {
      if (activeAccountView === 'fixes') {
        afficherChargesFixes();
        return;
      }

      let ops = rawData.operations || [];
      ops.sort((a, b) => new Date(b.date) - new Date(a.date));

      let soldeActuel = 0;
      let soldePrevisionnel = 0;
      let mCredit = 0;
      let mDebit = 0;

      const now = new Date();
      const currentMonthYear = now.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const opsDuCompte = ops.filter(op => (op.compte || 'courant') === activeAccountView);

      opsDuCompte.forEach(op => {
        const val = op.type === 'debit' ? -Math.abs(op.montant) : Math.abs(op.montant);
        
        if (!op.isPrevision) {
          soldeActuel += val;
          const d = new Date(op.date);
          if (d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) === currentMonthYear) {
            if (op.type === 'credit') mCredit += Math.abs(op.montant);
            else mDebit += Math.abs(op.montant);
          }
        }
        soldePrevisionnel += val;
      });

      if (activeAccountView === 'courant') {
        (rawData.chargesFixes || []).forEach(cf => {
          if (!cf.valideCeMois) {
            soldePrevisionnel += cf.type === 'debit' ? -Math.abs(cf.montant) : Math.abs(cf.montant);
          }
        });
      }

      document.getElementById('soldeActuel').innerText = `${soldeActuel.toFixed(2)} €`;
      document.getElementById('soldePrevisionnel').innerText = `${soldePrevisionnel.toFixed(2)} €`;

      const card = document.getElementById('dashboardCard');
      const seuil = parseFloat(localStorage.getItem('seuil_alerte')) || 200;

      card.classList.remove('status-green', 'status-orange', 'status-red');
      if (soldeActuel >= seuil) card.classList.add('status-green');
      else if (soldeActuel >= 0) card.classList.add('status-orange');
      else card.classList.add('status-red');

      document.getElementById('statCredit').innerText = `+${mCredit.toFixed(2)} €`;
      document.getElementById('statDebit').innerText = `-${mDebit.toFixed(2)} €`;

      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      let filteredOps = opsDuCompte.filter(op => {
        const matchSearch = op.description.toLowerCase().includes(searchQuery);
        const matchFilter = currentFilter === 'all' || op.type === currentFilter;
        return matchSearch && matchFilter;
      });

      const groupesParMois = {};
      filteredOps.forEach(op => {
        const mois = new Date(op.date).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        if (!groupesParMois[mois]) groupesParMois[mois] = [];
        groupesParMois[mois].push(op);
      });

      let html = "";
      for (const [mois, listeOps] of Object.entries(groupesParMois)) {
        html += `<div class="month-group"><div class="month-title">${mois}</div><div class="ops-list">`;
        listeOps.forEach(op => {
          const d = new Date(op.date);
          const icon = (op.categorie || "📦").split(' ')[0];
          const finCreditHtml = op.dateFinCredit ? `<span class="op-credit-end">🗓️ Fin : ${formatMonthYear(op.dateFinCredit)}</span>` : '';
          html += `
            <div class="operation-item ${op.isPrevision ? 'is-prevision' : ''}" onclick="ouvrirModalEdition('${op.id}')">
              <div class="op-left">
                <span class="op-cat-icon">${icon}</span>
                <div class="op-info">
                  <span class="op-desc">${op.description}</span>
                  ${finCreditHtml}
                  ${op.isPrevision ? `<button type="button" class="btn-action-charge prev" onclick="event.stopPropagation(); validerPrevision('${op.id}')">⏳ Valider Prévision</button>` : ''}
                </div>
              </div>
              <div class="op-amount-block">
                <div class="op-amount ${op.type}">${op.type === 'debit' ? '-' : '+'} ${Math.abs(op.montant).toFixed(2)} €</div>
                <div class="op-date">${d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' })}</div>
              </div>
            </div>`;
        });
        html += `</div></div>`;
      }

      document.getElementById('historiqueContainer').innerHTML = html || "<p style='text-align:center; color:var(--text-muted); font-size:0.9rem; margin-top:20px;'>Aucune opération.</p>";
    }

    function afficherChargesFixes() {
      let charges = rawData.chargesFixes || [];
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      
      charges = charges.filter(cf => {
        const matchSearch = cf.description.toLowerCase().includes(searchQuery);
        const matchFilter = currentFilter === 'all' || cf.type === currentFilter;
        return matchSearch && matchFilter;
      });

      let html = `<div class="month-group"><div class="month-title">CHARGES ET REVENUS DU CYCLE</div><div class="ops-list">`;
      charges.forEach(cf => {
        const icon = (cf.categorie || "📦").split(' ')[0];
        const estSalaire = cf.categorie.includes("Salaire") || cf.type === "credit";
        const finCreditHtml = cf.dateFinCredit ? `<span class="op-credit-end">🗓️ Fin : ${formatMonthYear(cf.dateFinCredit)}</span>` : '';
        
        html += `
          <div class="operation-item" style="${cf.valideCeMois ? 'opacity:0.4;' : ''}" onclick="ouvrirModalEditionCharge('${cf.id}')">
            <div class="op-left">
              <span class="op-cat-icon">${icon}</span>
              <div class="op-info">
                <span class="op-desc">${cf.description}</span>
                ${finCreditHtml}
                ${cf.valideCeMois ? '<span style="font-size:0.65rem; color:var(--green); font-weight:bold;">✅ Passé ce mois</span>' : 
                  (estSalaire ? `<button type="button" class="btn-action-charge salary" onclick="event.stopPropagation(); validerSalaire('${cf.id}')">💰 Valider Salaire</button>` :
                  `<button type="button" class="btn-action-charge" onclick="event.stopPropagation(); validerChargeFixe('${cf.id}')">⚡ Valider</button>`)}
              </div>
            </div>
            <div class="op-amount-block">
              <div class="op-amount ${cf.type}">${cf.type === 'debit' ? '-' : '+'} ${Math.abs(cf.montant).toFixed(2)} €</div>
              <div class="op-date" onclick="event.stopPropagation(); supprimerChargeFixe('${cf.id}')" style="cursor:pointer; color:var(--red); margin-top:4px;">🗑️</div>
            </div>
          </div>`;
      });

      html += `</div></div>`;
      document.getElementById('historiqueContainer').innerHTML = html || "<p style='text-align:center; color:var(--text-muted); font-size:0.9rem; margin-top:20px;'>Aucune charge fixe enregistrée.</p>";
    }

    async function validerPrevision(id) {
      const op = rawData.operations.find(o => o.id === id);
      if (op) {
        op.isPrevision = false;
        await pushToGitHub(`Validation prévision : ${op.description}`);
      }
    }

    async function validerChargeFixe(id) {
      const cf = rawData.chargesFixes.find(c => c.id === id);
      if (!cf) return;

      rawData.operations.push({
        id: Date.now().toString(),
        date: new Date().toISOString().slice(0, 10),
        compte: 'courant',
        description: cf.description,
        montant: cf.montant,
        type: cf.type,
        categorie: cf.categorie,
        dateFinCredit: cf.dateFinCredit || null,
        isPrevision: false
      });
      cf.valideCeMois = true;
      await pushToGitHub(`Validation charge : ${cf.description}`);
    }

    async function validerSalaire(id) {
      const cf = rawData.chargesFixes.find(c => c.id === id);
      if (!cf) return;

      const sMontant = prompt(`Saisis le montant exact de ton salaire ce mois-ci (€) :`, cf.montant);
      if (!sMontant) return;

      const montantExact = parseFloat(sMontant);

      rawData.operations.push({
        id: Date.now().toString(),
        date: new Date().toISOString().slice(0, 10),
        compte: 'courant',
        description: cf.description,
        montant: montantExact,
        type: 'credit',
        categorie: cf.categorie,
        isPrevision: false
      });
      cf.valideCeMois = true;

      if (confirm("Le salaire est enregistré ! Veux-tu réinitialiser toutes les charges fixes pour lancer le NOUVEAU MOIS ?")) {
        rawData.chargesFixes.forEach(c => c.valideCeMois = false);
      }

      await pushToGitHub(`Réception Salaire : ${montantExact} €`);
    }

    async function supprimerChargeFixe(id) {
      if (!confirm("Supprimer cette charge fixe récurrente ?")) return;
      rawData.chargesFixes = rawData.chargesFixes.filter(c => c.id !== id);
      await pushToGitHub("Suppression charge fixe");
    }

    async function supprimerOperation() {
      const id = document.getElementById('editOpId').value;
      if (!id || !confirm("Supprimer l'élément sélectionné ?")) return;
      
      const isFixe = document.getElementById('isChargeFixe').checked;
      if (isFixe) {
        rawData.chargesFixes = rawData.chargesFixes.filter(c => c.id !== id);
        await pushToGitHub("Suppression charge fixe");
      } else {
        rawData.operations = rawData.operations.filter(o => o.id !== id);
        await pushToGitHub("Suppression opération");
      }
    }

    function exporterJSON() {
      const backupData = {
        app_version: "2.1",
        date_export: new Date().toISOString(),
        config: {
          gh_user: localStorage.getItem('gh_user') || '',
          gh_repo: localStorage.getItem('gh_repo') || '',
          seuil_alerte: localStorage.getItem('seuil_alerte') || '200'
        },
        data: rawData
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `comptes_perso_backup_complet.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function exporterCSV() {
      let ops = rawData.operations || [];
      let charges = rawData.chargesFixes || [];

      let csv = "TypeDonnee;ID;Date;Type;Compte;Categorie;Description;Montant;Prevision;FinCredit\n";

      ops.forEach(o => {
        csv += `"OPERATION";"${o.id}";"${o.date}";"${o.type}";"${o.compte || 'courant'}";"${o.categorie || ''}";"${o.description}";${o.montant};"${o.isPrevision ? 'OUI' : 'NON'}";"${o.dateFinCredit || ''}"\n`;
      });

      charges.forEach(c => {
        csv += `"CHARGE_FIXE";"${c.id}";"Récurrente";"${c.type}";"courant";"${c.categorie || ''}";"${c.description}";${c.montant};"NON";"${c.dateFinCredit || ''}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.setAttribute("href", URL.createObjectURL(blob));
      link.setAttribute("download", `comptes_perso_export_complet.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function pushToGitHub(commitMessage) {
      const { user, repo, token } = getConfig();
      const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
      
      updateSyncStatus('pending');

      try {
        const getRes = await fetch(url, { headers: { Authorization: `token ${token}` } });
        if (!getRes.ok) throw new Error("Accès refusé");
        const fileData = await getRes.json();

        const nouveauContenuJSON = JSON.stringify(rawData, null, 2);
        const contentBase64 = btoa(unescape(encodeURIComponent(nouveauContenuJSON)));

        const putRes = await fetch(url, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: commitMessage, content: contentBase64, sha: fileData.sha })
        });

        if (putRes.ok) {
          updateSyncStatus('success');
          fermerModalOp();
          afficherDonnees();
          setTimeout(chargerDonnees, 1500);
        } else {
          throw new Error("Mise à jour échouée");
        }
      } catch (e) {
        updateSyncStatus('error');
        alert("Erreur de sauvegarde vers GitHub.");
      }
    }

    async function sauvegarderOperation(e) {
      e.preventDefault();
      const editId = document.getElementById('editOpId').value;
      const isFixe = document.getElementById('isChargeFixe').checked;

      const itemData = {
        id: editId || Date.now().toString(),
        description: document.getElementById('descOp').value,
        montant: parseFloat(document.getElementById('montantOp').value),
        categorie: document.getElementById('catOp').value,
        dateFinCredit: document.getElementById('dateFinCredit').value || null,
        type: currentType,
        compte: document.getElementById('compteOp').value
      };

      if (isFixe) {
        itemData.valideCeMois = false;
        if (editId) {
          const idx = rawData.chargesFixes.findIndex(c => c.id === editId);
          if (idx !== -1) rawData.chargesFixes[idx] = itemData;
        } else {
          rawData.chargesFixes.push(itemData);
        }
        await pushToGitHub(`Enregistrement Charge Fixe : ${itemData.description}`);
      } else {
        itemData.date = document.getElementById('dateOp').value;
        itemData.isPrevision = document.getElementById('isPrevision').checked;
        if (editId) {
          const idx = rawData.operations.findIndex(o => o.id === editId);
          if (idx !== -1) rawData.operations[idx] = itemData;
        } else {
          rawData.operations.push(itemData);
        }
        await pushToGitHub(`Enregistrement Dépense : ${itemData.description}`);
      }
    }

    initSecurity();
  </script>
