<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Budget Personnel</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        button {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background: var(--border);
        }

        button.primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .balance-card {
            text-align: center;
            padding: 24px 16px;
        }

        .balance-amount {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 8px 0;
        }

        .balance-amount.positive { color: var(--success); }
        .balance-amount.negative { color: var(--danger); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .transaction-list {
            list-style: none;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .transaction-title {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .transaction-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .transaction-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-amount {
            font-weight: 600;
            font-size: 1rem;
        }

        .transaction-amount.expense { color: var(--danger); }
        .transaction-amount.income { color: var(--success); }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 4px 8px;
            cursor: pointer;
        }
        .btn-delete:hover {
            color: var(--danger);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mon Budget</h1>
        <div class="header-actions">
            <button id="btnSecret" onclick="toggleSecretMode()">👁️ Secret</button>
            <button class="primary" onclick="openModal()">+ Ajouter</button>
        </div>
    </header>

    <!-- Solde Global -->
    <div class="card balance-card">
        <div class="stat-label">Solde Actuel</div>
        <div id="balanceDisplay" class="balance-amount positive">0,00 €</div>
    </div>

    <!-- Statistiques rapides -->
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Revenus du mois</div>
            <div id="totalIncome" class="stat-value" style="color: var(--success);">0,00 €</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Dépenses du mois</div>
            <div id="totalExpense" class="stat-value" style="color: var(--danger);">0,00 €</div>
        </div>
    </div>

    <!-- Liste des transactions -->
    <div class="card">
        <div class="section-title">
            <span>Historique</span>
        </div>
        <ul id="transactionList" class="transaction-list">
            <!-- Injecté par JS -->
        </ul>
    </div>

    <!-- Modal d'ajout simple (simplifiée pour l'exemple) -->
    <div id="addModal" class="card" style="display:none; margin-top: 20px;">
        <div class="section-title">Nouvelle transaction</div>
        <div class="form-group">
            <label>Libellé</label>
            <input type="text" id="txTitle" placeholder="Ex: Courses, Salaire...">
        </div>
        <div class="form-group">
            <label>Montant (€)</label>
            <input type="number" step="0.01" id="txAmount" placeholder="0.00">
        </div>
        <div class="form-group">
            <label>Type</label>
            <select id="txType">
                <option value="expense">Dépense</option>
                <option value="income">Revenu</option>
            </select>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="primary" style="flex:1;" onclick="addTransaction()">Enregistrer</button>
            <button onclick="closeModal()" style="flex:1;">Annuler</button>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [
            { id: 1, title: 'Salaire', amount: 2500, type: 'income', date: '2026-07-01' },
            { id: 2, title: 'Courses Supermarché', amount: 78.50, type: 'expense', date: '2026-07-27' },
            { id: 3, title: 'Essence', amount: 45.00, type: 'expense', date: '2026-07-28' }
        ];

        let secretMode = false;

        function toggleSecretMode() {
            secretMode = !secretMode;
            const btn = document.getElementById('btnSecret');
            btn.textContent = secretMode ? "🙈 Masqué" : "👁️ Secret";
            render();
        }

        function formatAmount(amount, type) {
            if (secretMode) return "••••• €";
            const formatted = Math.abs(amount).toFixed(2).replace('.', ',') + ' €';
            return type === 'income' ? `+ ${formatted}` : `- ${formatted}`;
        }

        function formatRawAmount(amount) {
            if (secretMode) return "••••• €";
            return amount.toFixed(2).replace('.', ',') + ' €';
        }

        function render() {
            const listEl = document.getElementById('transactionList');
            listEl.innerHTML = '';

            let totalInc = 0;
            let totalExp = 0;

            transactions.forEach(tx => {
                if (tx.type === 'income') totalInc += tx.amount;
                else totalExp += tx.amount;

                const li = document.createElement('li');
                li.className = 'transaction-item';
                
                li.innerHTML = `
                    <div class="transaction-info">
                        <span class="transaction-title">${tx.title}</span>
                        <span class="transaction-date">${tx.date}</span>
                    </div>
                    <div class="transaction-right">
                        <span class="transaction-amount ${tx.type}">${formatAmount(tx.amount, tx.type)}</span>
                        <button class="btn-delete" onclick="deleteTransaction(${tx.id})">&times;</button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            const balance = totalInc - totalExp;
            const balanceEl = document.getElementById('balanceDisplay');
            balanceEl.textContent = formatRawAmount(balance);
            balanceEl.className = 'balance-amount ' + (balance >= 0 ? 'positive' : 'negative');

            document.getElementById('totalIncome').textContent = formatRawAmount(totalInc);
            document.getElementById('totalExpense').textContent = formatRawAmount(totalExp);

            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        function openModal() {
            document.getElementById('addModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        function addTransaction() {
            const title = document.getElementById('txTitle').value.trim();
            const amount = parseFloat(document.getElementById('txAmount').value);
            const type = document.getElementById('txType').value;

            if (!title || isNaN(amount) || amount <= 0) {
                alert('Veuillez remplir correctement les champs.');
                return;
            }

            const newTx = {
                id: Date.now(),
                title,
                amount,
                type,
                date: new Date().toISOString().split('T')[0]
            };

            transactions.unshift(newTx);
            document.getElementById('txTitle').value = '';
            document.getElementById('txAmount').value = '';
            closeModal();
            render();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(tx => tx.id !== id);
            render();
        }

        // Premier affichage
        render();
    </script>
</body>
</html>
